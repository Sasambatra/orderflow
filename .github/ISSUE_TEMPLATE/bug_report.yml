name: Bug report
description: Report a reproducible problem using synthetic data.
title: "bug: "
body:
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or API sequence and expected versus actual behaviour.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Python/PostgreSQL/Redis versions and relevant redacted output. Do not include tokens, passwords or real user data.
