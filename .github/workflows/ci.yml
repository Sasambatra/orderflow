name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orderflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://orderflow:ci-only-password@127.0.0.1:5432/orderflow_test
      TEST_DATABASE_URL: postgresql+psycopg://orderflow:ci-only-password@127.0.0.1:5432/orderflow_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-only-jwt-secret-over-32-characters-long
      WEBHOOK_SECRET: ci-only-webhook-secret-over-32-characters-long
      RATE_LIMIT_ENABLED: "false"
      RUN_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Install a private Redis executable for outage tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q --cov=orderflow --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml
      - name: Write verification summary
        run: python scripts/ci_report.py
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.13'
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python scripts/setup_env.py
      - run: docker compose up -d --build --wait api worker beat
      - run: curl --fail http://127.0.0.1:8001/health/ready
      - name: Full checkout and worker-delivered notification
        run: |
          docker compose exec -T api orderflow seed
          docker compose exec -T api python scripts/demo.py
      - name: Concurrent HTTP checkout of the last unit
        run: docker compose exec -T api python scripts/benchmark.py
      - name: Complete test suite inside the development container
        run: docker compose --profile test run --build --rm tests
      - if: failure()
        run: docker compose --profile test logs --no-color
      - if: always()
        run: docker compose --profile test down --remove-orphans
