name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orderflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://orderflow:ci-only-password@127.0.0.1:5432/orderflow_test
      TEST_DATABASE_URL: postgresql+psycopg://orderflow:ci-only-password@127.0.0.1:5432/orderflow_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-only-jwt-secret-over-32-characters-long
      WEBHOOK_SECRET: ci-only-webhook-secret-over-32-characters-long
      RATE_LIMIT_ENABLED: "false"
      RUN_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q --cov=orderflow --cov-report=xml --cov-fail-under=85
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/setup_env.py
      - run: docker compose up -d --build --wait api worker beat
      - run: curl --fail http://127.0.0.1:8001/health/ready
      - if: always()
        run: docker compose logs --no-color && docker compose down
