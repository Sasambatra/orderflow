name: orderflow

x-app: &app
  build:
    context: .
    target: runtime
  environment: &environment
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://orderflow:${POSTGRES_PASSWORD:?Run make setup}@db:5432/orderflow
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:?Run make setup}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Run make setup}
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-900}
    RATE_LIMIT_ENABLED: "true"
    LOG_LEVEL: INFO
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: orderflow
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["demo-data:/app/.local"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15

  worker:
    <<: *app
    command: ["celery", "-A", "orderflow.workers.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *app
    command: ["celery", "-A", "orderflow.workers.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/app/.local/celerybeat-schedule"]

  db-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: orderflow_test
    ports: ["127.0.0.1:5434:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: development
    profiles: ["test"]
    environment:
      <<: *environment
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://orderflow:${POSTGRES_PASSWORD}@db-test:5432/orderflow_test
      TEST_DATABASE_URL: postgresql+psycopg://orderflow:${POSTGRES_PASSWORD}@db-test:5432/orderflow_test
      REDIS_URL: redis://redis:6379/15
      TEST_REDIS_URL: redis://redis:6379/15
      RATE_LIMIT_ENABLED: "false"
      RUN_E2E: "1"
    depends_on:
      db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "-q", "--cov=orderflow", "--cov-fail-under=85"]

volumes:
  postgres-data:
  redis-data:
  demo-data:
