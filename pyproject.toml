[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-service"
version = "0.1.0"
description = "Transactional order reservations, idempotent payments and durable background events"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2", "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "celery[redis]>=5.6,<6",
  "email-validator>=2.2,<3", "httpx>=0.28,<1", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "build>=1.3,<2", "httpx2>=2.16,<3"]

[project.scripts]
orderflow = "orderflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: requires a live Redis broker and Celery worker"]

[tool.coverage.run]
source = ["orderflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".local", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
